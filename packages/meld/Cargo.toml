[package]
name = "meld"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "meld"
path = "src/main.rs"

[dependencies]
workshop = { path = "../workshop" }
iroh = "0.97"
iroh-tickets = "0.4"
ratatui = "0.30"
vt100 = "0.16"
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
