[workspace]

members = [
    "packages/workshop",
    "packages/workshop_desktop",
    "packages/workshop_ui/crate",
    "packages/pty_manager",
    "packages/tty_wrapper",
    "packages/virtual_terminal",
    "packages/meld",
]
# workshop_ui/crate requires WORKSHOP_UI_PATH env var pointing to SvelteKit build output.
# workshop_desktop requires Tauri system dependencies (WebKit, etc.).
# Exclude both from default `cargo build` to avoid build failures. Build with:
#   WORKSHOP_UI_PATH=packages/workshop_ui/build cargo build -p workshop_ui
#   cargo check -p workshop_desktop
default-members = [
    "packages/workshop",
    "packages/pty_manager",
    "packages/tty_wrapper",
    "packages/virtual_terminal",
    "packages/meld",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8.1", features = ["macros"] }
axum-extra = { version = "0.10.0", features = ["typed-header"] }
chrono = "0.4"
clap = { version = "4.5.31", features = ["derive"] }
futures = "0.3.30"
futures-util = { version = "0.3.30", features = ["sink"] }
maud = { version = "0.27.0", features = ["axum"] }
reqwest = { version = "0.12.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "charset",
    "gzip",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
thiserror = "1.0"
tokio = { version = "1.40.0", features = ["full"] }
tokio-test = "0.4.4"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.13.2", features = ["v4"] }
workshop = { path = "packages/workshop" }
pty_manager = { path = "packages/pty_manager" }
virtual_terminal = { path = "packages/virtual_terminal" }
